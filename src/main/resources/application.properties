spring.application.name=server

server.port=8081

# H2 Connection:
spring.datasource.generate-unique-name=false
spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true

# Preserva o nome das tabelas (ex.: itensDoPedido) em vez de converter para snake_case
spring.jpa.hibernate.naming.physical-strategy=br.edu.utfpr.pb.pw44s.server.config.TableNameKeepingNamingStrategy
